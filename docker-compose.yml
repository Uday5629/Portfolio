version: '3.8'

services:
  resume-website:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uday-resume
    ports:
      - "80:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Development service (optional - for local development with hot reload)
  resume-dev:
    image: node:20-alpine
    container_name: uday-resume-dev
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3002:3000"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    profiles:
      - dev
